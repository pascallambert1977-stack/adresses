<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SIC ADVISOR</title>

<style>
:root { --primary:#800080; --bg:#fdfafc; }
body{
  font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  margin:0;padding:20px;color:#333;min-height:100vh;
}
.bg-layer{
  position:fixed;inset:0;z-index:-1;
  background-color:var(--bg);
  background-size:cover;
  background-position:top center;
  background-repeat:no-repeat;
  pointer-events:none;
}
.container{max-width:760px;margin:0 auto;}
h1{text-align:center;color:var(--primary);font-variant:small-caps;}
.toolbar{display:flex;justify-content:flex-end;gap:8px;}
.btn{background:white;border:1px solid var(--primary);color:var(--primary);
padding:6px 10px;border-radius:8px;cursor:pointer;}
.btn.primary{background:var(--primary);color:#fff;}
.card{background:white;padding:20px;border-radius:15px;
box-shadow:0 4px 12px rgba(0,0,0,.1);margin-bottom:20px;}
.result-item{
background:white;padding:15px;margin-bottom:15px;
border-radius:12px;border-left:8px solid var(--primary);
position:relative;
}
.actions{position:absolute;top:15px;right:15px;display:flex;gap:10px;}
.btn-edit,.btn-del{
background:none;border:none;cursor:pointer;
text-decoration:underline;font-size:.85em;
}
.btn-del{color:#b00020;}
.badge{
background:#f3e5f5;color:var(--primary);
padding:3px 8px;border-radius:5px;
font-size:.7em;font-weight:bold;text-transform:uppercase;
margin-left:8px;
}
.btn-maps{
display:inline-block;
background:var(--primary);
color:white;
text-align:center;
padding:10px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
margin-top:10px;
}
.empty{color:#777;font-style:italic;text-align:center;padding:10px;}
</style>
</head>

<body>

<div id="bgLayer" class="bg-layer"></div>

<div class="container">
  <div class="toolbar">
    <button class="btn primary" onclick="openModalForCreate()">➕ Ajouter</button>
  </div>
  <h1>SIC ADVISOR</h1>
  <div id="results"></div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-card">
    <h2 id="formTitle">➕ Ajouter</h2>
    <input type="hidden" id="editId">

    <label>Nom</label>
    <input id="f-name">

    <label>Type</label>
    <select id="f-type"></select>

    <label>Zone</label>
    <select id="f-isbx" onchange="toggleZone()">
      <option value="oui">Bruxelles</option>
      <option value="non">Hors Bruxelles</option>
    </select>

    <div id="box-bx">
      <label>Commune</label>
      <select id="f-commune"></select>
    </div>

    <div id="box-hors" style="display:none">
      <label>Ville</label>
      <input id="f-city">
    </div>

    <label>Adresse</label>
    <input id="f-addr">

    <label>Commentaire</label>
    <input id="f-comment">

    <button class="btn primary" onclick="save()">Enregistrer</button>
    <button class="btn" onclick="closeModal()">Annuler</button>
  </div>
</div>

<script>
const communes=["Ixelles","Uccle","Forest","Etterbeek"];
const TYPE_KEYS=['cafe','hotel','restaurant','culture','autre'];
const TYPE_EMOJI={cafe:'☕',hotel:'🏨',restaurant:'🍽️',culture:'🎭',autre:'🏷️'};
let lang='fr';

const tr={
fr:{edit:"📝 Modifier",maps:"🗺️ Ouvrir dans Maps",
types:{cafe:"Café",hotel:"Hôtel",restaurant:"Restaurant",culture:"Culture",autre:"Autre"}}
};

let database=[];

function emojiForType(t){return TYPE_EMOJI[t]||'🏷️';}

function buildMapsUrl(item){
  const lieu=item.isBx?item.commune:item.city;
  const q=`${item.name} ${item.addr}, ${lieu}, Belgique`;
  const params=new URLSearchParams({api:'1',query:q,hl:'fr',gl:'BE'});
  return `https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.google.com%2Fmaps%2Fsearch%2F%3F%24&data=05%7C02%7CPascal.Lambert%40police.belgium.eu%7Ca72fca7d60094e86ebc608de72e24905%7Cf7e06a0857c2479ebfa5e63a6dd83518%7C0%7C0%7C639074513373895576%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=sdjvZbzeWLW0uajfMIrNhj62w4%2B1Q8o0Any%2BRmYDy3c%3D&reserved=0{params}`;
}

function refresh(){
  const list=document.getElementById('results');
  list.innerHTML="";

  if(!database.length){
    list.innerHTML='<div class="empty">Aucun résultat</div>';
    return;
  }

  database.forEach(i=>{
    const lieu=i.isBx?i.commune:i.city;
    const url=buildMapsUrl(i);
    const type=i.type;

    list.innerHTML+=`
    <div class="result-item">
      <div class="actions">
        <button class="btn-edit" onclick="loadEdit(${i.id})">${tr[lang].edit}</button>
        <button class="btn-del" onclick="del(${i.id})">X</button>
      </div>

      <h3>${i.name}
        <span class="badge">${emojiForType(type)} ${tr[lang].types[type]}</span>
      </h3>

      <p>📍 ${i.addr}, ${lieu}</p>
      ${i.comment?`<p style="font-style:italic;color:gray;">💬 ${i.comment}</p>`:''}

      <!-- ✅ LIEN GOOGLE MAPS CORRIGÉ -->
      <a class="btn-maps"
         href="${url}"
         target="_blank"
         rel="noopener noreferrer">
         ${tr[lang].maps}
      </a>
    </div>`;
  });
}

function openModalForCreate(){
  document.getElementById('modal').style.display='block';
}
function closeModal(){
  document.getElementById('modal').style.display='none';
}
function toggleZone(){
  const bx=document.getElementById('f-isbx').value==='oui';
  document.getElementById('box-bx').style.display=bx?'block':'none';
  document.getElementById('box-hors').style.display=bx?'none':'block';
}
function save(){
  const obj={
    id:Date.now(),
    name:f('f-name'),
    addr:f('f-addr'),
    comment:f('f-comment'),
    isBx:f('f-isbx')==='oui',
    commune:f('f-commune'),
    city:f('f-city'),
    type:f('f-type')||'autre'
  };
  database.push(obj);
  closeModal();
  refresh();
}
function del(id){
  database=database.filter(x=>x.id!==id);
  refresh();
}
function loadEdit(id){}
function f(id){return document.getElementById(id).value;}

(function init(){
  const sel=document.getElementById('f-commune');
  communes.forEach(c=>sel.add(new Option(c,c)));
  const st=document.getElementById('f-type');
  TYPE_KEYS.forEach(k=>st.add(new Option(`${emojiForType(k)} ${tr[lang].types[k]}`,k)));
})();
</script>

</body>
</html>
