<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIC Advisor – Version légère</title>

<style>
  body {
    font-family: Segoe UI, Arial, sans-serif;
    padding: 15px;
    background: #faf7fc;
  }

  h1 {
    text-align: center;
    color: #7a0080;
    margin-bottom: 20px;
  }

  .card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  input, select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  .btn {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .btn-primary {
    background: #7a0080;
    color: white;
    width: 100%;
    margin-top: 10px;
  }
  .btn-small {
    background: #eee;
    margin-left: 5px;
  }

  .result {
    background: #fff;
    padding: 12px;
    border-left: 5px solid #7a0080;
    border-radius: 8px;
    margin-bottom: 12px;
  }

  .actions {
    text-align: right;
    margin-top: 8px;
  }
  .actions button {
    background: none;
    border: none;
    cursor: pointer;
    color: #7a0080;
    text-decoration: underline;
  }
</style>
</head>

<body>
<h1>🔮 SIC Advisor (léger)</h1>

<!-- Recherche -->
<div class="card">
  <input type="text" id="search" placeholder="Rechercher par nom..." oninput="refresh()" />
</div>

<!-- Résultats -->
<div id="results"></div>

<!-- Formulaire -->
<div class="card">
  <h2 id="formTitle">Ajouter un lieu</h2>
  <input type="hidden" id="editId">

  <label>Nom</label>
  <input id="name">

  <label>Type</label>
  <select id="type">
    <option value="cafe">☕ Café</option>
    <option value="restaurant">🍽️ Restaurant</option>
    <option value="hotel">🏨 Hôtel</option>
    <option value="culture">🎭 Culture</option>
    <option value="autre">🏷️ Autre</option>
  </select>

  <label>Zone</label>
  <select id="isBx" onchange="toggleZone()">
    <option value="oui">Bruxelles</option>
    <option value="non">Hors Bruxelles</option>
  </select>

  <div id="bxBox">
    <label>Commune</label>
    <input id="commune">
  </div>

  <div id="cityBox" style="display:none;">
    <label>Ville</label>
    <input id="city">
  </div>

  <label>Adresse</label>
  <input id="addr">

  <label>Commentaire</label>
  <input id="comment">

  <button class="btn btn-primary" onclick="save()">Enregistrer</button>
</div>

<script>
  let db = JSON.parse(localStorage.getItem("sic_data") || "[]");

  function saveDB() {
    localStorage.setItem("sic_data", JSON.stringify(db));
  }

  function toggleZone() {
    const isBx = document.getElementById("isBx").value === "oui";
    document.getElementById("bxBox").style.display = isBx ? "block" : "none";
    document.getElementById("cityBox").style.display = isBx ? "none" : "block";
  }

  function save() {
    const id = document.getElementById("editId").value;
    const obj = {
      id: id ? Number(id) : Date.now(),
      name: document.getElementById("name").value.trim(),
      type: document.getElementById("type").value,
      isBx: document.getElementById("isBx").value === "oui",
      commune: document.getElementById("commune").value.trim(),
      city: document.getElementById("city").value.trim(),
      addr: document.getElementById("addr").value.trim(),
      comment: document.getElementById("comment").value.trim()
    };

    if (!obj.name || !obj.addr) {
      alert("Nom + adresse obligatoires");
      return;
    }

    if (id) {
      const i = db.findIndex(x => x.id == id);
      db[i] = obj;
    } else {
      db.push(obj);
    }

    saveDB();
    resetForm();
    refresh();
  }

  function loadEdit(id) {
    const x = db.find(o => o.id === id);
    document.getElementById("editId").value = x.id;
    document.getElementById("name").value = x.name;
    document.getElementById("type").value = x.type;
    document.getElementById("isBx").value = x.isBx ? "oui" : "non";
    toggleZone();
    document.getElementById("commune").value = x.commune;
    document.getElementById("city").value = x.city;
    document.getElementById("addr").value = x.addr;
    document.getElementById("comment").value = x.comment;
    document.getElementById("formTitle").textContent = "Modifier un lieu";
  }

  function del(id) {
    if (!confirm("Supprimer ?")) return;
    db = db.filter(o => o.id !== id);
    saveDB();
    refresh();
  }

  function resetForm() {
    document.getElementById("editId").value = "";
    document.getElementById("formTitle").textContent = "Ajouter un lieu";
    document.querySelectorAll("#name,#addr,#comment,#commune,#city").forEach(e => e.value = "");
  }

  function mapsUrl(x) {
    const place = x.isBx ? x.commune : x.city;
    const q = encodeURIComponent(`${x.name}, ${x.addr}, ${place}, Belgique`);
    return `https://www.google.com/maps/search/?api=1&query=${q}`;
  }

  function refresh() {
    const q = document.getElementById("search").value.toLowerCase().trim();
    const zone = document.getElementById("zone")?.value || "tous";
    const out = document.getElementById("results");
    out.innerHTML = "";

    db
      .filter(x => x.name.toLowerCase().includes(q))
      .sort((a,b) => a.name.localeCompare(b.name))
      .forEach(x => {
        out.innerHTML += `
        <div class="result">
          <strong>${x.name}</strong> (${x.type})<br>
          📍 ${x.addr} ${x.isBx ? x.commune : x.city}<br>
          ${x.comment ? "💬 " + x.comment : ""}
          <div class="actions">
            <button onclick="loadEdit(${x.id})">Modifier</button>
            <button onclick="del(${x.id})">Supprimer</button>
            <a href="${mapsUrl(x)}" target="_blank">Maps</a>
          </div>
        </div>`;
      });
  }

  refresh();
</script>

</body>
</html>
