<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SIC ADVISOR</title>

<style>
:root { --primary:#800080; --bg:#fdfafc; }
body{
font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
margin:0;padding:20px;color:#333;min-height:100vh;
}
.bg-layer{
position:fixed;inset:0;z-index:-1;
background-color:var(--bg);
background-size:cover;
background-position:top center;
background-repeat:no-repeat;
pointer-events:none;
}
.container{max-width:760px;margin:0 auto;}
h1{text-align:center;color:var(--primary);font-variant:small-caps;}
.toolbar{display:flex;justify-content:flex-end;gap:8px;}
.btn{background:white;border:1px solid var(--primary);color:var(--primary);
padding:6px 10px;border-radius:8px;cursor:pointer;}
.btn.primary{background:var(--primary);color:#fff;}
.card{background:white;padding:20px;border-radius:15px;
box-shadow:0 4px 12px rgba(0,0,0,.1);margin-bottom:20px;}
.result-item{
background:white;padding:15px;margin-bottom:15px;
border-radius:12px;border-left:8px solid var(--primary);
position:relative;
}
.actions{position:absolute;top:15px;right:15px;display:flex;gap:10px;}
.btn-edit,.btn-del{
background:none;border:none;cursor:pointer;
text-decoration:underline;font-size:.85em;
}
.btn-del{color:#b00020;}
.badge{
background:#f3e5f5;color:var(--primary);
padding:3px 8px;border-radius:5px;
font-size:.7em;font-weight:bold;text-transform:uppercase;
margin-left:8px;
}
.btn-maps{
display:inline-block;
background:var(--primary);
color:white;
text-align:center;
padding:10px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
margin-top:10px;
}
.empty{color:#777;font-style:italic;text-align:center;padding:10px;}
</style>
</head>

<body>

<div id="bgLayer" class="bg-layer"></div>

<div class="container">
<h1>SIC ADVISOR</h1>
<div id="results"></div>
</div>

<script>
const TYPE_KEYS=['cafe','hotel','restaurant','culture','autre'];
const TYPE_EMOJI={cafe:'☕',hotel:'🏨',restaurant:'🍽️',culture:'🎭',autre:'🏷️'};
let lang='fr';

const tr={
fr:{
edit:"📝 Modifier",
maps:"🗺️ Ouvrir dans Maps",
types:{cafe:"Café",hotel:"Hôtel",restaurant:"Restaurant",culture:"Culture",autre:"Autre"}
}
};

let database=[
{
id:1,
name:"Exemple Café",
isBx:true,
commune:"Ixelles",
city:"",
addr:"Rue de Test 1",
comment:"Entrée par l’arrière",
type:"cafe"
}
];

function normalizeLower(s){
return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function buildMapsUrl(item){
const lieu=item.isBx?item.commune:item.city;
const q=`${item.name} ${item.addr}, ${lieu}, Belgique`;
const params=new URLSearchParams({api:'1',query:q,hl:'fr',gl:'BE'});
return`https://www.google.com/maps/search/?${params.toString()}`;
}

function refresh(){
const list=document.getElementById('results');
list.innerHTML="";

if(!database.length){
list.innerHTML=`<div class="empty">Aucun résultat</div>`;
return;
}

database.forEach(i=>{
const lieu=i.isBx?i.commune:i.city;
const type=i.type;
const url=buildMapsUrl(i);

list.innerHTML+=`
<div class="result-item">
<div class="actions">
<button class="btn-edit">${tr[lang].edit}</button>
<button class="btn-del">X</button>
</div>

<h3>
${i.name}
<span class="badge">${TYPE_EMOJI[type]} ${tr[lang].types[type]}</span>
</h3>

<p>📍 ${i.addr}, ${lieu}</p>
${i.comment?`<p style="font-style:italic;color:gray;">💬 ${i.comment}</p>`:''}

<a class="btn-maps"
href="${url}"
target="_blank"
rel="noopener noreferrer">
${tr[lang].maps}
</a>
</div>`;
});
}

refresh();
</script>

</body>
</html>
