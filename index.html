<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon Carnet Pourpre</title>
<style>

        :root {

            --primary: #800080; 

            --bg: #fdfafc;

        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); max-width: 800px; margin: 0 auto; padding: 20px; color: #333; }

        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(128,0,128,0.08); border: 1px solid #eee; }

        h1 { color: var(--primary); text-align: center; font-variant: small-caps; }

        h2 { font-size: 1.1em; color: #444; border-left: 4px solid var(--primary); padding-left: 10px; margin-bottom: 15px; }

        .btn { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; cursor: pointer; font-size: 16px; border-radius: 10px; font-weight: bold; transition: 0.3s; margin-top: 10px; }

        .btn:hover { filter: brightness(1.2); }

        .btn-alt { background: #4a4a4a; font-size: 0.8em; margin-top: 5px; }

        .result-item { background: white; padding: 15px; margin-bottom: 15px; border-radius: 12px; border-left: 8px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .badge { background: #f3e5f5; color: var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 0.75em; font-weight: bold; text-transform: uppercase; }

        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.85em; color: #666; }

        select, input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }

        .delete-btn { color: #ff4d4d; background: none; border: none; cursor: pointer; text-decoration: underline; font-size: 0.75em; float: right; }

        .map-link { color: var(--primary); font-weight: bold; text-decoration: none; display: inline-block; margin-top: 10px; }
</style>
</head>
<body>
<h1>🔮 Mon Explorateur Pourpre</h1>
<div class="card" style="background: #fdf5ff;">
<h2>📤 Échange de données</h2>
<div style="display: flex; gap: 10px;">
<button class="btn btn-alt" onclick="exporterDonnees()">💾 Sauvegarder (JSON)</button>
<button class="btn btn-alt" onclick="document.getElementById('fileIn').click()">📂 Charger un fichier</button>
</div>
<input type="file" id="fileIn" style="display:none" onchange="importerDonnees(event)">
</div>
<div class="card">
<h2>🔍 Trouver un lieu</h2>
<label>Rechercher par nom :</label>
<input type="text" id="searchName" placeholder="Ex: Belga..." onkeyup="rechercher()">
<label>Zone :</label>
<select id="searchZone" onchange="rechercher()">
<option value="tous">Toutes les zones</option>
<option value="bx">Bruxelles</option>
<option value="hors">Hors Bruxelles</option>
</select>
<div id="searchCityBox" style="display:none;">
<label>Ville précise :</label>
<input type="text" id="searchCity" placeholder="Ex: Namur, Liège..." onkeyup="rechercher()">
</div>
</div>
<div id="displayArea"></div>
<div class="card" style="border-top: 6px solid #FFD700;">
<h2>➕ Ajouter une adresse</h2>
<label>Nom de l'établissement :</label>
<input type="text" id="addName">
<label>Type :</label>
<select id="addType">
<option value="☕ Café">Café</option>
<option value="🍴 Restaurant">Restaurant</option>
<option value="🏨 Hôtel">Hôtel</option>
<option value="🎭 Culture">Autre</option>
</select>
<label>C'est à Bruxelles ?</label>
<select id="addIsBx" onchange="toggleFormAdd()">
<option value="oui">Oui</option>
<option value="non">Non (Ailleurs)</option>
</select>
<div id="addBoxBx">
<label>Commune :</label>
<select id="addCommune"></select>
</div>
<div id="addBoxHors" style="display:none">
<label>Ville :</label>
<input type="text" id="addCity" placeholder="Ex: Waterloo">
</div>
<label>Adresse :</label>
<input type="text" id="addAddr" placeholder="Rue et numéro">
<button class="btn" onclick="ajouterLieu()">Enregistrer dans ma liste</button>
</div>
<script>

        const communes = ["Anderlecht", "Auderghem", "Berchem-Sainte-Agathe", "Bruxelles-Ville", "Etterbeek", "Evere", "Forest", "Ganshoren", "Ixelles", "Jette", "Koekelberg", "Molenbeek-Saint-Jean", "Saint-Gilles", "Saint-Josse-ten-Noode", "Schaerbeek", "Uccle", "Watermael-Boitsfort", "Woluwe-Saint-Lambert", "Woluwe-Saint-Pierre"];

        let database = JSON.parse(localStorage.getItem('monCarnetV5')) || [];

        window.onload = function() {

            const sel = document.getElementById('addCommune');

            communes.sort().forEach(c => sel.add(new Option(c, c)));

            rechercher();

        };

        function toggleFormAdd() {

            const isBx = document.getElementById('addIsBx').value === 'oui';

            document.getElementById('addBoxBx').style.display = isBx ? 'block' : 'none';

            document.getElementById('addBoxHors').style.display = isBx ? 'none' : 'block';

        }

        function rechercher() {

            const zone = document.getElementById('searchZone').value;

            const cityFilter = document.getElementById('searchCity').value.toLowerCase();

            const nameFilter = document.getElementById('searchName').value.toLowerCase();

            const container = document.getElementById('displayArea');

            // Afficher ou cacher la barre de ville selon la zone choisie

            document.getElementById('searchCityBox').style.display = (zone === 'hors') ? 'block' : 'none';

            container.innerHTML = "";

            const filtered = database.filter(l => {

                const matchZone = (zone === 'tous') || (zone === 'bx' && l.isBx) || (zone === 'hors' && !l.isBx);

                const matchCity = (zone !== 'hors') || l.city.toLowerCase().includes(cityFilter);

                const matchName = l.name.toLowerCase().includes(nameFilter);

                return matchZone && matchCity && matchName;

            });

            filtered.forEach(l => {

                const ville = l.isBx ? l.commune : l.city;

                const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.name + ' ' + l.addr + ' ' + ville)}`;

                container.innerHTML += `
<div class="result-item">
<button class="delete-btn" onclick="supprimer(${l.id})">Supprimer</button>
<span class="badge">${l.type}</span>
<h3>${l.name}</h3>
<p>📍 ${l.addr}, ${ville}</p>
<a href="${url}" target="_blank" class="map-link">🗺️ Google Maps</a>
</div>`;

            });

        }

        function ajouterLieu() {

            const nom = document.getElementById('addName').value;

            const adr = document.getElementById('addAddr').value;

            if(!nom || !adr) return alert("Remplissez le nom et l'adresse !");

            database.push({

                id: Date.now(),

                name: nom,

                type: document.getElementById('addType').value,

                isBx: document.getElementById('addIsBx').value === 'oui',

                commune: document.getElementById('addCommune').value,

                city: document.getElementById('addCity').value,

                addr: adr

            });

            sauver();

            document.getElementById('addName').value = "";

            document.getElementById('addAddr').value = "";

        }

        function supprimer(id) {

            if(confirm("Supprimer ?")) {

                database = database.filter(l => l.id !== id);

                sauver();

            }

        }

        function sauver() {

            localStorage.setItem('monCarnetV5', JSON.stringify(database));

            rechercher();

        }

        function exporterDonnees() {

            const blob = new Blob([JSON.stringify(database)], {type: "application/json"});

            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');

            a.href = url;

            a.download = "adresses.json";

            a.click();

        }

        function importerDonnees(event) {

            const reader = new FileReader();

            reader.onload = function(e) {

                const importes = JSON.parse(e.target.result);

                database = database.concat(importes);

                sauver();

            };

            reader.readAsText(event.target.files[0]);

        }
</script>
</body>
</html>
