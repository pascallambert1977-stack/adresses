<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Carnet de Lieux</title>
    <style>
        :root { --primary: #800080; --accent: #FFD700; }
        body { font-family: 'Segoe UI', sans-serif; background: #fdfafc; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: var(--primary); text-align: center; font-variant: small-caps; }
       
        /* Boutons Langue */
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .btn-lang { background: white; border: 1px solid var(--primary); color: var(--primary); padding: 5px 12px; border-radius: 8px; cursor: pointer; }
       
        /* Cartes */
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .result-item { background: white; padding: 15px; margin-bottom: 15px; border-radius: 12px; border-left: 8px solid var(--primary); position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
       
        /* Actions Modifier/Supprimer */
        .actions { position: absolute; top: 12px; right: 12px; }
        .btn-edit { color: #007bff; background: none; border: none; cursor: pointer; text-decoration: underline; font-size: 0.85em; font-weight: bold; }
        .btn-del { color: #dc3545; background: none; border: none; cursor: pointer; text-decoration: underline; font-size: 0.85em; margin-left: 10px; }
       
        /* Bouton Maps */
        .btn-maps { display: block; background: var(--primary); color: white; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 15px; }
       
        /* Formulaire */
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.85em; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .note { font-style: italic; color: #666; font-size: 0.9em; margin-top: 8px; border-top: 1px solid #eee; padding-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button class="btn-lang" onclick="switchLang()" id="langBtn">🇳🇱 NL</button>
    </div>
   
    <h1 id="appTitle">🔮 Lieu de contact</h1>

    <div class="card">
        <input type="text" id="searchInput" placeholder="Rechercher..." onkeyup="refresh()">
        <select id="searchZone" onchange="refresh()" style="margin-top:10px;">
            <option value="tous" id="optAll">🌍 Toutes les zones</option>
            <option value="bx">🇧🇪 Bruxelles</option>
            <option value="hors">🚗 Hors Bruxelles</option>
        </select>
    </div>

    <div id="results"></div>

    <div class="card" id="formSection" style="border-top: 5px solid var(--accent);">
        <h2 id="formTitle">➕ Ajouter</h2>
        <input type="hidden" id="editId">
       
        <label>Nom :</label><input type="text" id="f-name">
        <label>Zone :</label>
        <select id="f-isbx" onchange="toggleZone()">
            <option value="oui">Bruxelles</option>
            <option value="non">Hors Bruxelles</option>
        </select>

        <div id="box-bx"><label>Commune :</label><select id="f-commune"></select></div>
        <div id="box-hors" style="display:none"><label>Ville :</label><input type="text" id="f-city"></div>

        <label>Adresse :</label><input type="text" id="f-addr">
        <label>Note :</label><textarea id="f-note" rows="2"></textarea>
       
        <button class="btn-save" id="btnSubmit" onclick="save()">Enregistrer</button>
        <button id="btnCancel" onclick="resetForm()" style="display:none; width:100%; background:none; border:none; color:gray; cursor:pointer; margin-top:10px;">Annuler la modification</button>
    </div>
</div>

<script>
    const communes = ["Anderlecht","Auderghem","Berchem-Sainte-Agathe","Bruxelles-Ville","Etterbeek","Evere","Forest","Ganshoren","Ixelles","Jette","Koekelberg","Molenbeek-Saint-Jean","Saint-Gilles","Saint-Josse-ten-Noode","Schaerbeek","Uccle","Watermael-Boitsfort","Woluwe-Saint-Lambert","Woluwe-Saint-Pierre"];
    const tr = {
        fr: { app: "🔮 Lieu de contact", all: "🌍 Toutes les zones", add: "➕ Ajouter", edit: "📝 Modifier", maps: "🗺️ Voir l'itinéraire", save: "Enregistrer", update: "Mettre à jour" },
        nl: { app: "🔮 Contactplaats", all: "🌍 Alle zones", add: "➕ Toevoegen", edit: "📝 Bewerken", maps: "🗺️ Route plannen", save: "Opslaan", update: "Bijwerken" }
    };

    let lang = localStorage.getItem('lang_pref') || 'fr';
    let database = JSON.parse(localStorage.getItem('data_pref')) || [];

    function init() {
        const sel = document.getElementById('f-commune');
        communes.forEach(c => sel.add(new Option(c, c)));
        applyLang();
        refresh();
    }

    function switchLang() {
        lang = lang === 'fr' ? 'nl' : 'fr';
        localStorage.setItem('lang_pref', lang);
        applyLang();
        refresh();
    }

    function applyLang() {
        const l = tr[lang];
        document.getElementById('appTitle').innerText = l.app;
        document.getElementById('optAll').innerText = l.all;
        document.getElementById('langBtn').innerText = lang === 'fr' ? '🇳🇱 NL' : '🇫🇷 FR';
        const isEditing = document.getElementById('editId').value !== "";
        document.getElementById('btnSubmit').innerText = isEditing ? l.update : l.save;
    }

    function toggleZone() {
        const isBx = document.getElementById('f-isbx').value === 'oui';
        document.getElementById('box-bx').style.display = isBx ? 'block' : 'none';
        document.getElementById('box-hors').style.display = isBx ? 'none' : 'block';
    }

    function refresh() {
        const list = document.getElementById('results');
        const sName = document.getElementById('searchInput').value.toLowerCase();
        const sZone = document.getElementById('searchZone').value;
        list.innerHTML = "";

        database.filter(i => {
            const mName = i.name.toLowerCase().includes(sName);
            const mZone = (sZone === 'tous') || (sZone === 'bx' && i.isBx) || (sZone === 'hors' && !i.isBx);
            return mName && mZone;
        }).forEach(i => {
            const lieu = i.isBx ? i.commune : i.city;
            // --- LIEN MAPS ULTRA-ROBUSTE ---
            const texteRecherche = encodeURIComponent(i.name + " " + i.addr + " " + lieu);
            const mapsUrl = "https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.google.com%2Fmaps%2Fsearch%2F%3Fapi%3D1%26query%3D&data=05%7C02%7CPascal.Lambert%40police.belgium.eu%7C139ab23ad8244eeaf32f08de6fc397bc%7Cf7e06a0857c2479ebfa5e63a6dd83518%7C0%7C0%7C639071083013251830%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=cUsrVKT%2BRNLkPL3GyH8a6C89U0goRKgX1YZ0bSVqQwo%3D&reserved=0" + texteRecherche;

            list.innerHTML += `
                <div class="result-item">
                    <div class="actions">
                        <button class="btn-edit" onclick="loadEdit(` + i.id + `)">` + tr[lang].edit + `</button>
                        <button class="btn-del" onclick="del(` + i.id + `)">X</button>
                    </div>
                    <h3 style="margin: 0 0 5px 0;">` + i.name + `</h3>
                    <p style="margin: 0; font-size: 0.9em;">📍 ` + i.addr + `, ` + lieu + `</p>
                    ` + (i.note ? `<p class="note">💬 ` + i.note + `</p>` : '') + `
                    <a href="` + mapsUrl + `" target="_blank" class="btn-maps">` + tr[lang].maps + `</a>
                </div>`;
        });
    }

    function save() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('f-name').value;
        const addr = document.getElementById('f-addr').value;
        if(!name || !addr) return alert("Nom et Adresse obligatoires");

        const obj = {
            id: id ? parseInt(id) : Date.now(),
            name: name,
            isBx: document.getElementById('f-isbx').value === 'oui',
            commune: document.getElementById('f-commune').value,
            city: document.getElementById('f-city').value,
            addr: addr,
            note: document.getElementById('f-note').value
        };

        if(id) {
            const idx = database.findIndex(x => x.id === parseInt(id));
            database[idx] = obj;
        } else {
            database.push(obj);
        }

        localStorage.setItem('data_pref', JSON.stringify(database));
        resetForm();
        refresh();
    }

    function loadEdit(id) {
        const i = database.find(x => x.id === id);
        document.getElementById('editId').value = i.id;
        document.getElementById('f-name').value = i.name;
        document.getElementById('f-isbx').value = i.isBx ? 'oui' : 'non';
        toggleZone();
        if(i.isBx) document.getElementById('f-commune').value = i.commune;
        else document.getElementById('f-city').value = i.city;
        document.getElementById('f-addr').value = i.addr;
        document.getElementById('f-note').value = i.note || "";
       
        document.getElementById('formTitle').innerText = tr[lang].edit;
        document.getElementById('btnCancel').style.display = 'block';
        document.getElementById('formSection').scrollIntoView({behavior: 'smooth'});
        applyLang();
    }

    function resetForm() {
        document.getElementById('editId').value = "";
        document.getElementById('f-name').value = "";
        document.getElementById('f-addr').value = "";
        document.getElementById('f-note').value = "";
        document.getElementById('formTitle').innerText = tr[lang].add;
        document.getElementById('btnCancel').style.display = 'none';
        applyLang();
    }

    function del(id) {
        if(confirm("Supprimer ce lieu ?")) {
            database = database.filter(x => x.id !== id);
            localStorage.setItem('data_pref', JSON.stringify(database));
            refresh();
        }
    }

    init();
</script>
</body>
</html>
