<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIC ADVISOR</title>

  <!-- (Facultatif) Favicons/manifest si tu as posé les fichiers. Sinon, tu peux supprimer ces 4 lignes. -->
  icons/apple-touch-icon.png?v=1
  icons/favicon-32x32.png?v=1
  icons/favicon-16x16.png?v=1
  site.webmanifest?v=1

  <style>
    :root{
      --bg:#F2F4F7;         /* gris clair plein écran */
      --ink:#0B132B;        /* texte principal */
      --accent:#083D77;     /* bleu foncé bordures/boutons */
      --accent-weak:#E6EEF8;/* survol doux */
      --white:#FFFFFF;
      --badge:#DDE8F6;
    }
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
      display:flex; flex-direction:column;
    }

    /* Barre supérieure */
    .toolbar{
      display:flex; gap:8px; align-items:center; justify-content:flex-end;
      padding:14px 16px; background:var(--white);
      border-bottom:3px solid var(--accent);
    }
    .brand{ margin-right:auto; font-weight:700; letter-spacing:.3px; color:var(--accent); }
    .btn{
      border:2px solid var(--accent); color:var(--accent); background:var(--white);
      padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:600;
    }
    .btn:hover{ background:var(--accent-weak); }
    .btn.primary{ background:var(--accent); color:var(--white); }
    .btn.primary:hover{ filter:brightness(.95); }
    .btn.small{ padding:6px 10px; }

    /* Contenu */
    .content{ flex:1; display:grid; grid-template-columns:1fr; gap:16px; padding:16px; box-sizing:border-box; }

    /* Carte de recherche */
    .card{
      background:var(--white); border:3px solid var(--accent); border-radius:16px; padding:16px;
    }
    .card h3{ margin:0 0 10px 0; color:var(--accent); }
    label{ display:block; margin-top:12px; font-weight:600; }
    input,select{
      width:100%; box-sizing:border-box; margin-top:6px; padding:10px;
      border-radius:10px; border:2px solid var(--accent); background:#FAFBFD;
    }

    /* Résultats */
    .results-meta{ color:#475569; margin:8px 0 16px; }
    .empty{ color:#6b7280; font-style:italic; padding:12px; text-align:center; }
    .result-item{
      background:var(--white); border:3px solid var(--accent); border-radius:14px; padding:14px; position:relative; margin-bottom:12px;
    }
    .actions{ position:absolute; top:12px; right:12px; display:flex; gap:8px; }
    .btn-edit,.btn-del{
      border:2px solid var(--accent); background:var(--white); color:var(--accent);
      padding:4px 8px; border-radius:8px; cursor:pointer; font-size:.85rem;
    }
    .btn-del{ border-color:#b91c1c; color:#b91c1c; }
    .badge{
      background:var(--badge); color:var(--accent); padding:2px 8px; border-radius:999px; font-size:.75rem;
      margin-left:8px; font-weight:700; border:2px solid var(--accent);
    }
    .btn-maps{
      display:inline-block; margin-top:8px; background:var(--accent); color:var(--white); text-decoration:none;
      padding:8px 12px; border-radius:10px; font-weight:700; border:2px solid var(--accent);
    }
    .btn-maps:hover{ filter:brightness(.95); }

    /* Modal */
    .modal{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
    .modal.open{ display:flex; }
    .modal-card{ width:100%; max-width:700px; background:var(--white); border:3px solid var(--accent); border-radius:16px; padding:16px; }
    .modal-row{ display:grid; grid-template-columns:1fr; gap:12px; }
    .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:12px; }
    .modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .modal-title{ margin:0; color:var(--accent); }
    .modal-close{ background:transparent; border:0; font-size:1.4rem; cursor:pointer; color:#64748b; }
  </style>
</head>
<body>
  <!-- Barre -->
  <div class="toolbar">
    <div class="brand">SIC ADVISOR</div>
    <button class="btn" onclick="triggerImport()" title="Importer (ajouter)">📥 Importer (ajouter)</button>
    <button class="btn" onclick="exportAddresses()" title="Exporter adresses (JSON)">📤 Exporter adresses</button>
    <button class="btn small" id="btnLang" onclick="switchLang()">🇳🇱 NL</button>
    <button class="btn primary small" onclick="openModalForCreate()">➕ Ajouter</button>
    <input type="file" id="fileInput" accept="application/json" style="display:none" />
  </div>

  <!-- Contenu -->
  <div class="content">
    <!-- Recherche -->
    <div class="card">
      <h3 id="searchTitle">🔍 Rechercher</h3>
      <input type="text" id="searchInput" placeholder="Nom..." onkeyup="onSearchChange()" autocomplete="off" />
      <label for="searchZone" id="labelZone">Zone</label>
      <select id="searchZone" onchange="onSearchChange(); updateCommuneCityVisibility()">
        <option value="tous" id="optAll">🌍 Toutes les zones</option>
        <option value="bx">🇧🇪 Bruxelles</option>
        <option value="hors">🚗 Hors Bruxelles</option>
      </select>

      <!-- Commune (si Bruxelles) -->
      <div id="filter-commune" style="display:none;">
        <label for="searchCommune" id="labelSearchCommune">Commune</label>
        <select id="searchCommune" onchange="onSearchChange()">
          <option value="all" id="optAllComm">Toutes les communes</option>
        </select>
      </div>

      <!-- Ville (si Hors Bruxelles) -->
      <div id="filter-city" style="display:none;">
        <label for="searchCity" id="labelSearchCity">Ville</label>
        <select id="searchCity" onchange="onSearchChange()">
          <option value="all" id="optAllCity">Toutes les villes</option>
        </select>
      </div>

      <div class="results-meta" id="resultsMeta"></div>
    </div>

    <!-- Résultats -->
    <div id="results"></div>
  </div>

  <!-- MODAL: Ajouter / Modifier -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="formTitle" class="modal-title">➕ Ajouter</h3>
        <button class="modal-close" aria-label="Fermer" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body modal-row">
        <input type="hidden" id="editId">

        <div>
          <label for="f-name">Nom</label>
          <input type="text" id="f-name" required>
        </div>

        <div>
          <label for="f-isbx">Zone</label>
          <select id="f-isbx" onchange="toggleZone()">
            <option value="oui">Bruxelles</option>
            <option value="non">Hors Bruxelles</option>
          </select>
        </div>

        <div id="box-bx">
          <label for="f-commune">Commune</label>
          <select id="f-commune"></select>
        </div>

        <div id="box-hors" style="display:none;">
          <label for="f-city">Ville</label>
          <input type="text" id="f-city" placeholder="Ville">
        </div>

        <div>
          <label for="f-addr">Adresse</label>
          <input type="text" id="f-addr" placeholder="Rue, numéro..." required autocomplete="street-address">
        </div>

        <div>
          <label for="f-comment">Commentaire (optionnel)</label>
          <input type="text" id="f-comment" placeholder="Infos utiles (sonnette, entrée, ...)">
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Annuler</button>
        <button class="btn primary" id="btnSubmit" onclick="save()">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    // ---------- Données & i18n ----------
    const communes = ["Anderlecht","Auderghem","Berchem-Sainte-Agathe","Bruxelles-Ville","Etterbeek","Evere","Forest","Ganshoren","Ixelles","Jette","Koekelberg","Molenbeek-Saint-Jean","Saint-Gilles","Saint-Josse-ten-Noode","Schaerbeek","Uccle","Watermael-Boitsfort","Woluwe-Saint-Lambert","Woluwe-Saint-Pierre"];

    const tr = {
      fr: {
        app: "SIC ADVISOR",
        search: "🔍 Rechercher",
        zone: "Zone",
        all: "🌍 Toutes les zones",
        bx: "🇧🇪 Bruxelles",
        hors: "🚗 Hors Bruxelles",
        communeLabel: "Commune",
        cityLabel: "Ville",
        allCommunes: "Toutes les communes",
        allCities: "Toutes les villes",
        add: "➕ Ajouter",
        edit: "📝 Modifier",
        save: "Enregistrer",
        update: "Mettre à jour",
        maps: "🗺️ Ouvrir dans Maps",
        results: (n) => n === 0 ? "Aucun résultat" : n === 1 ? "1 résultat" : `${n} résultats`,
        importAdd: "Importer (ajouter)",
        exportJson: "Exporter adresses (JSON)"
      },
      nl: {
        app: "SIC ADVISOR",
        search: "🔍 Zoeken",
        zone: "Zone",
        all: "🌍 Alle zones",
        bx: "🇧🇪 Brussel",
        hors: "🚗 Buiten Brussel",
        communeLabel: "Gemeente",
        cityLabel: "Stad",
        allCommunes: "Alle gemeenten",
        allCities: "Alle steden",
        add: "➕ Toevoegen",
        edit: "📝 Bewerken",
        save: "Opslaan",
        update: "Bijwerken",
        maps: "🗺️ Openen in Maps",
        results: (n) => n === 0 ? "Geen resultaat" : n === 1 ? "1 resultaat" : `${n} resultaten`,
        importAdd: "Importeren (toevoegen)",
        exportJson: "Adressen exporteren (JSON)"
      }
    };

    const LS = { lang:'simple_lang', data:'simple_data', q:'simple_q', zone:'simple_zone', commune:'simple_commune', city:'simple_city' };

    // ---------- État ----------
    let lang = localStorage.getItem(LS.lang) || 'fr';
    let database = JSON.parse(localStorage.getItem(LS.data) || '[]');
    let searchQ = localStorage.getItem(LS.q) || '';
    let searchZone = localStorage.getItem(LS.zone) || 'tous';
    let searchCommune = localStorage.getItem(LS.commune) || 'all';
    let searchCity = localStorage.getItem(LS.city) || 'all';

    // ---------- Utils ----------
    function normalizeLower(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }

    function buildMapsUrl(item) {
      const lieu = item.isBx ? item.commune : item.city;
      const country = (lang === 'nl') ? 'België' : 'Belgique';
      const q = `${item.name} ${item.addr}${lieu ? ', '+lieu : ''}, ${country}`.trim();
      const params = new URLSearchParams({ api:'1', query:q, hl:lang, gl:'BE' });
      return `https://www.google.com/maps/search/?${params.toString()}`;
    }

    function updateResultsMeta(n=0){ document.getElementById('resultsMeta').textContent = tr[lang].results(n); }
    function setText(id, text){ const el=document.getElementById(id); if(el) el.innerText=text; }

    // ---------- Init ----------
    function init(){
      // i18n / textes
      document.getElementById('btnLang').innerText = (lang==='fr') ? '🇳🇱 NL' : '🇫🇷 FR';
      document.title = tr[lang].app;
      setText('searchTitle', tr[lang].search);
      setText('labelZone', tr[lang].zone);
      setText('optAll', tr[lang].all);
      setText('labelSearchCommune', tr[lang].communeLabel);
      setText('labelSearchCity', tr[lang].cityLabel);
      setText('optAllComm', tr[lang].allCommunes);
      setText('optAllCity', tr[lang].allCities);

      // Recherche persistée
      document.getElementById('searchInput').value = searchQ;
      document.getElementById('searchZone').value = searchZone;

      // Form & filtre communes
      const selFormComm = document.getElementById('f-commune');
      selFormComm.innerHTML = '';
      communes.forEach(c => selFormComm.add(new Option(c, c)));

      const selFilterComm = document.getElementById('searchCommune');
      selFilterComm.innerHTML = '';
      selFilterComm.add(new Option(tr[lang].allCommunes, 'all'));
      communes.forEach(c => selFilterComm.add(new Option(c, c)));
      selFilterComm.value = searchCommune;

      // Villes (filtre) d’après la base
      rebuildCityFilterOptions(true);

      // Affichages conditionnels
      updateCommuneCityVisibility();

      // Rendu
      refresh();

      // Fermeture modale : Esc / clic overlay
      document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });
      document.getElementById('modal').addEventListener('click',(e)=>{ if(e.target.id==='modal') closeModal(); });
    }

    function switchLang(){ lang = (lang==='fr') ? 'nl' : 'fr'; localStorage.setItem(LS.lang, lang); init(); }

    // ---------- Filtres ----------
    function onSearchChange(){
      searchQ = document.getElementById('searchInput').value;
      searchZone = document.getElementById('searchZone').value;

      // commune
      const selFilterComm = document.getElementById('searchCommune');
      if (searchZone === 'bx') { searchCommune = selFilterComm.value || 'all'; }
      else { searchCommune = 'all'; selFilterComm.value = 'all'; }

      // ville
      const selFilterCity = document.getElementById('searchCity');
      if (searchZone === 'hors') { searchCity = selFilterCity.value || 'all'; }
      else { searchCity = 'all'; selFilterCity.value = 'all'; }

      localStorage.setItem(LS.q, searchQ);
      localStorage.setItem(LS.zone, searchZone);
      localStorage.setItem(LS.commune, searchCommune);
      localStorage.setItem(LS.city, searchCity);

      updateCommuneCityVisibility();
      refresh();
    }

    function updateCommuneCityVisibility(){
      document.getElementById('filter-commune').style.display = (document.getElementById('searchZone').value==='bx') ? 'block':'none';
      document.getElementById('filter-city').style.display    = (document.getElementById('searchZone').value==='hors') ? 'block':'none';
    }

    function rebuildCityFilterOptions(preserve=true){
      const sel = document.getElementById('searchCity');
      const prev = preserve ? (sel.value || searchCity) : 'all';
      const set = new Set();
      database.forEach(i => { if(!i.isBx && i.city && i.city.trim()) set.add(i.city.trim()); });
      const cities = Array.from(set).sort((a,b)=> normalizeLower(a).localeCompare(normalizeLower(b)));
      sel.innerHTML = '';
      sel.add(new Option(tr[lang].allCities,'all'));
      cities.forEach(c => sel.add(new Option(c,c)));
      sel.value = cities.includes(prev) ? prev : 'all';
      searchCity = sel.value;
      localStorage.setItem(LS.city, searchCity);
    }

    // ---------- Rendu ----------
    function refresh(){
      const list = document.getElementById('results');
      list.innerHTML = '';

      const sName = normalizeLower(document.getElementById('searchInput').value);
      const sZone = document.getElementById('searchZone').value;
      const sCommune = document.getElementById('searchCommune').value || 'all';
      const sCity = document.getElementById('searchCity').value || 'all';

      const filtered = database
        .filter(i => {
          const mName = normalizeLower(i.name).includes(sName);
          const mZone = (sZone==='tous') || (sZone==='bx' && i.isBx) || (sZone==='hors' && !i.isBx);
          const mCommune = (sZone!=='bx') || (sCommune==='all') || (i.isBx && normalizeLower(i.commune)===normalizeLower(sCommune));
          const mCity = (sZone!=='hors') || (sCity==='all') || (!i.isBx && normalizeLower(i.city)===normalizeLower(sCity));
          return mName && mZone && mCommune && mCity;
        })
        .sort((a,b)=> normalizeLower(a.name).localeCompare(normalizeLower(b.name)));

      updateResultsMeta(filtered.length);

      if(filtered.length===0){
        list.innerHTML = `<div class="empty">${tr[lang].results(0)}</div>`;
        return;
      }

      filtered.forEach(i => {
        const lieu = i.isBx ? i.commune : (i.city || '');
        const mapsUrl = buildMapsUrl(i);
        const comment = i.comment ? `<p style="color:#64748b;margin:.35rem 0 0 0;"><em>💬 ${i.comment}</em></p>` : '';
        list.innerHTML += `
          <div class="result-item">
            <div class="actions">
              <button class="btn-edit" onclick="loadEdit(${i.id})">${tr[lang].edit}</button>
              <button class="btn-del" onclick="del(${i.id})">Supprimer</button>
            </div>
            <h3 style="margin:0 0 6px 0;color:#0b132b;">${i.name}
              ${i.isBx ? `<span class="badge">Bruxelles</span>` : `<span class="badge">Hors Bxl</span>`}
            </h3>
            <p style="margin:.25rem 0 0 0;">📍 ${i.addr}${lieu ? `, ${lieu}` : ''}</p>
            ${comment}
            <a class="btn-maps" href="${mapsUrl}" target="_blank" rel="noopener noreferrer">${tr[lang].maps}</a>
          </div>
        `;
      });
    }

    // ---------- CRUD ----------
    function toggleZone(){
      const isBx = document.getElementById('f-isbx').value === 'oui';
      document.getElementById('box-bx').style.display = isBx ? 'block' : 'none';
      document.getElementById('box-hors').style.display = isBx ? 'none' : 'block';
    }
    function openModal(){ document.getElementById('modal').classList.add('open'); setTimeout(()=>document.getElementById('f-name').focus(),50); }
    function closeModal(){ document.getElementById('modal').classList.remove('open'); }
    function openModalForCreate(){
      resetForm();
      document.getElementById('formTitle').innerText = tr[lang].add;
      document.getElementById('btnSubmit').innerText = tr[lang].save;
      openModal();
    }
    function loadEdit(id){
      const i = database.find(x=>x.id===id);
      if(!i) return;
      document.getElementById('editId').value = i.id;
      document.getElementById('f-name').value = i.name;
      document.getElementById('f-isbx').value = i.isBx ? 'oui' : 'non';
      toggleZone();
      document.getElementById('f-commune').value = i.commune || '';
      document.getElementById('f-city').value = i.city || '';
      document.getElementById('f-addr').value = i.addr;
      document.getElementById('f-comment').value = i.comment || '';
      document.getElementById('formTitle').innerText = tr[lang].edit;
      document.getElementById('btnSubmit').innerText = tr[lang].update;
      openModal();
    }
    function resetForm(){
      document.getElementById('editId').value = '';
      document.getElementById('f-name').value = '';
      document.getElementById('f-isbx').value = 'oui';
      toggleZone();
      document.getElementById('f-commune').value = '';
      document.getElementById('f-city').value = '';
      document.getElementById('f-addr').value = '';
      document.getElementById('f-comment').value = '';
    }
    function save(){
      const id = document.getElementById('editId').value;
      const name = document.getElementById('f-name').value.trim();
      const addr = document.getElementById('f-addr').value.trim();
      const isBx = document.getElementById('f-isbx').value === 'oui';
      const commune = document.getElementById('f-commune').value;
      const city = document.getElementById('f-city').value.trim();
      const comment = document.getElementById('f-comment').value.trim();

      if(!name || !addr){ alert(lang==='fr'?'Nom et Adresse obligatoires':'Naam en adres zijn verplicht'); return; }

      const obj = { id: id ? parseInt(id) : Date.now(), name, addr, isBx, commune, city, comment };

      // Doublon = même Nom + Adresse + Lieu
      const key = `${normalizeLower(name)}|${normalizeLower(addr)}|${normalizeLower(isBx ? commune : city)}`;
      const idx = database.findIndex(x => `${normalizeLower(x.name)}|${normalizeLower(x.addr)}|${normalizeLower(x.isBx ? x.commune : x.city)}` === key);

      if(id){
        const i = database.findIndex(x=>x.id===parseInt(id));
        if(i!==-1) database[i] = obj;
      }else if(idx!==-1){
        obj.id = database[idx].id; database[idx] = obj;
      }else{
        database.push(obj);
      }

      localStorage.setItem(LS.data, JSON.stringify(database));
      rebuildCityFilterOptions(true);
      closeModal();
      refresh();
    }
    function del(id){
      if(!confirm(lang==='fr'?'Supprimer ?':'Verwijderen?')) return;
      database = database.filter(x=>x.id!==id);
      localStorage.setItem(LS.data, JSON.stringify(database));
      rebuildCityFilterOptions(true);
      refresh();
    }

    // ---------- Import / Export ----------
    function triggerImport(){
      const inp = document.getElementById('fileInput');
      inp.value = '';
      inp.onchange = ()=> doImport(inp.files[0]);
      inp.click();
    }
    function doImport(file){
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const parsed = JSON.parse(reader.result);
          const items = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.items) ? parsed.items : []);
          if(!items.length){ alert(lang==='fr'?'Aucune adresse trouvée dans le fichier.':'Geen adressen gevonden in het bestand.'); return; }
          items.forEach(obj=>{
            if(!obj || !obj.name || !obj.addr) return;
            const safe = {
              id: obj.id ? parseInt(obj.id) : Date.now()+Math.floor(Math.random()*1000),
              name: String(obj.name), addr: String(obj.addr),
              isBx: !!obj.isBx,
              commune: obj.commune || '',
              city: obj.city || '',
              comment: typeof obj.comment==='string' ? obj.comment : ''
            };
            const keyNew = `${normalizeLower(safe.name)}|${normalizeLower(safe.addr)}|${normalizeLower(safe.isBx ? safe.commune : safe.city)}`;
            const idx = database.findIndex(x => `${normalizeLower(x.name)}|${normalizeLower(x.addr)}|${normalizeLower(x.isBx ? x.commune : x.city)}` === keyNew);
            if(idx!==-1){ database[idx]=safe; } else { database.push(safe); }
          });
          localStorage.setItem(LS.data, JSON.stringify(database));
          rebuildCityFilterOptions(true);
          refresh();
          alert(lang==='fr'?'Import terminé (ajout/mise à jour).':'Import voltooid (toegevoegd/bijgewerkt).');
        }catch(e){
          console.error(e);
          alert((lang==='fr'?'Erreur d’import : ':'Importfout: ')+e.message);
        }
      };
      reader.readAsText(file,'utf-8');
    }
    function exportAddresses(){
      const items = database.map(x=>({ id:x.id, name:x.name, addr:x.addr, isBx:!!x.isBx, commune:x.commune||'', city:x.city||'', comment:x.comment||'' }));
      const payload = { version:1, items };
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const date = new Date().toISOString().slice(0,10);
      a.href = url; a.download = `adresses_${date}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    // ---------- Start ----------
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
