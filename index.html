<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lieu de Contact</title>
    <style>
        :root { --primary: #800080; --secondary: #f3e5f5; --accent: #FFD700; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #fdfafc; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
       
        /* En-tête */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: var(--primary); font-size: 1.5em; margin: 0; font-variant: small-caps; }
        .btn-top { background: white; border: 1px solid var(--primary); color: var(--primary); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9em; }

        /* Cartes */
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #eee; }
        .item { border-left: 6px solid var(--primary); position: relative; }
       
        /* Badges & Actions */
        .badge { background: var(--secondary); color: var(--primary); padding: 3px 8px; border-radius: 5px; font-size: 0.75em; font-weight: bold; }
        .actions { position: absolute; top: 10px; right: 10px; }
        .btn-action { background: none; border: none; cursor: pointer; font-size: 0.8em; text-decoration: underline; }
        .btn-edit { color: #007bff; }
        .btn-del { color: #dc3545; margin-left: 8px; }

        /* Formulaire */
        .form-title { border-top: 3px solid var(--accent); padding-top: 15px; margin-top: 20px; }
        label { display: block; font-size: 0.85em; font-weight: bold; margin: 10px 0 4px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
       
        /* Boutons */
        .btn-save { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1em; margin-top: 15px; cursor: pointer; }
        .btn-maps { display: block; background: #28a745; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; font-size: 0.95em; }
        .comment { font-style: italic; color: #666; font-size: 0.9em; margin-top: 10px; border-top: 1px solid #f0f0f0; padding-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="txt-app-title">🔮 Lieu de contact</h1>
        <div>
            <button class="btn-top" onclick="switchLang()" id="btn-lang">🇳🇱 NL</button>
            <button class="btn-top" onclick="exportData()">💾</button>
        </div>
    </div>

    <div class="card">
        <input type="text" id="search" placeholder="Rechercher un nom..." onkeyup="render()">
        <select id="filterZone" onchange="render()" style="margin-top:10px;">
            <option value="all">🌍 Toutes les zones</option>
            <option value="bx">🇧🇪 Bruxelles</option>
            <option value="hors">🚗 Hors Bruxelles</option>
        </select>
    </div>

    <div id="list"></div>

    <div class="card form-title" id="form-anchor">
        <h2 id="txt-form-title" style="margin:0; font-size: 1.2em;">➕ Ajouter</h2>
        <input type="hidden" id="edit-id">
       
        <label id="lbl-name">Nom</label>
        <input type="text" id="f-name">

        <label>Type</label>
        <select id="f-type">
            <option value="🍴 Restaurant">🍴 Restaurant</option>
            <option value="☕ Café / Bar">☕ Café / Bar</option>
            <option value="🏨 Hôtel">🏨 Hôtel</option>
            <option value="🎭 Culture">🎭 Culture</option>
            <option value="📍 Autre">📍 Autre</option>
        </select>

        <label>Zone</label>
        <select id="f-isbx" onchange="toggleZoneField()">
            <option value="true">Bruxelles</option>
            <option value="false">Hors Bruxelles</option>
        </select>

        <div id="box-bx">
            <label>Commune</label>
            <select id="f-commune"></select>
        </div>
        <div id="box-hors" style="display:none">
            <label>Ville</label>
            <input type="text" id="f-city">
        </div>

        <label>Adresse</label>
        <input type="text" id="f-addr">

        <label>Note</label>
        <textarea id="f-note" rows="2"></textarea>

        <button class="btn-save" id="btn-submit" onclick="save()">Enregistrer</button>
        <button id="btn-cancel" onclick="resetForm()" style="display:none; width:100%; background:none; border:none; color:gray; cursor:pointer; margin-top:10px;">Annuler la modification</button>
    </div>
</div>

<script>
    const tr = {
        fr: { app: "🔮 Lieu de contact", search: "Rechercher...", all: "🌍 Toutes les zones", add: "➕ Ajouter", edit: "📝 Modifier", maps: "🗺️ Voir l'itinéraire Maps", save: "Enregistrer", update: "Mettre à jour", delConfirm: "Supprimer ?" },
        nl: { app: "🔮 Contactplaats", search: "Zoeken...", all: "🌍 Alle zones", add: "➕ Toevoegen", edit: "📝 Bewerken", maps: "🗺️ Route plannen Maps", save: "Opslaan", update: "Bijwerken", delConfirm: "Wissen ?" }
    };

    const communes = ["Anderlecht","Auderghem","Berchem-Sainte-Agathe","Bruxelles-Ville","Etterbeek","Evere","Forest","Ganshoren","Ixelles","Jette","Koekelberg","Molenbeek-Saint-Jean","Saint-Gilles","Saint-Josse-ten-Noode","Schaerbeek","Uccle","Watermael-Boitsfort","Woluwe-Saint-Lambert","Woluwe-Saint-Pierre"];

    const defaultData = [
        {id:1, name:"Ibis Waterloo", type:"🏨 Hôtel", isbx:false, city:"Waterloo", addr:"Bd Henri Rolin 5A", note:""},
        {id:2, name:"Musée BD", type:"🎭 Culture", isbx:true, commune:"Bruxelles-Ville", addr:"Rue des Sables 20", note:""},
        {id:3, name:"Hilton Diegem", type:"🏨 Hôtel", isbx:false, city:"Diegem", addr:"Culliganlaan 3A", note:"Dries ou Pascal"}
    ];

    let lang = localStorage.getItem('lang_v29') || 'fr';
    let data = JSON.parse(localStorage.getItem('data_v29')) || defaultData;

    function init() {
        const cSel = document.getElementById('f-commune');
        communes.forEach(c => cSel.add(new Option(c, c)));
        applyLang();
        render();
    }

    function switchLang() {
        lang = lang === 'fr' ? 'nl' : 'fr';
        localStorage.setItem('lang_v29', lang);
        applyLang();
        render();
    }

    function applyLang() {
        const t = tr[lang];
        document.getElementById('txt-app-title').innerText = t.app;
        document.getElementById('search').placeholder = t.search;
        document.getElementById('btn-lang').innerText = lang === 'fr' ? '🇳🇱 NL' : '🇫🇷 FR';
        document.getElementById('btn-submit').innerText = document.getElementById('edit-id').value ? t.update : t.save;
    }

    function toggleZoneField() {
        const isBx = document.getElementById('f-isbx').value === "true";
        document.getElementById('box-bx').style.display = isBx ? 'block' : 'none';
        document.getElementById('box-hors').style.display = isBx ? 'none' : 'block';
    }

    function render() {
        const list = document.getElementById('list');
        const searchVal = document.getElementById('search').value.toLowerCase();
        const zoneVal = document.getElementById('filterZone').value;
        list.innerHTML = "";

        data.filter(item => {
            const matchName = item.name.toLowerCase().includes(searchVal);
            const matchZone = (zoneVal === 'all') || (zoneVal === 'bx' && item.isbx) || (zoneVal === 'hors' && !item.isbx);
            return matchName && matchZone;
        }).forEach(item => {
            const lieuStr = item.isbx ? item.commune : item.city;
            // LA SEULE URL GOOGLE MAPS QUI NE FAILLE JAMAIS
            const mapsUrl = `https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.google.com%2Fmaps%2Fsearch%2F%3Fapi%3D1%26query%3D%24&data=05%7C02%7CPascal.Lambert%40police.belgium.eu%7Cf69714b6d3d34a76f06208de6fbf09cc%7Cf7e06a0857c2479ebfa5e63a6dd83518%7C0%7C0%7C639071063459998389%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=GhG4mzHw5htgN9e%2Fw94tRSMzJaP0pmcVyuI%2BtmpseZA%3D&reserved=0{encodeURIComponent(item.name + " " + item.addr + " " + lieuStr)}`;

            list.innerHTML += `
                <div class="card item">
                    <div class="actions">
                        <button class="btn-action btn-edit" onclick="editItem(${item.id})">${tr[lang].edit}</button>
                        <button class="btn-action btn-del" onclick="deleteItem(${item.id})">X</button>
                    </div>
                    <span class="badge">${item.type}</span>
                    <h3 style="margin:10px 0 5px 0;">${item.name}</h3>
                    <p style="margin:0; font-size:0.9em; color:#555;">📍 ${item.addr}, ${lieuStr}</p>
                    ${item.note ? `<div class="comment">💬 ${item.note}</div>` : ''}
                    <a href="${mapsUrl}" target="_blank" class="btn-maps">${tr[lang].maps}</a>
                </div>
            `;
        });
    }

    function save() {
        const id = document.getElementById('edit-id').value;
        const name = document.getElementById('f-name').value;
        const addr = document.getElementById('f-addr').value;

        if (!name || !addr) return alert("Nom et Adresse requis !");

        const newItem = {
            id: id ? parseInt(id) : Date.now(),
            name: name,
            type: document.getElementById('f-type').value,
            isbx: document.getElementById('f-isbx').value === "true",
            commune: document.getElementById('f-commune').value,
            city: document.getElementById('f-city').value,
            addr: addr,
            note: document.getElementById('f-note').value
        };

        if (id) {
            const idx = data.findIndex(i => i.id === parseInt(id));
            data[idx] = newItem;
        } else {
            data.push(newItem);
        }

        localStorage.setItem('data_v29', JSON.stringify(data));
        resetForm();
        render();
    }

    function editItem(id) {
        const item = data.find(i => i.id === id);
        document.getElementById('edit-id').value = item.id;
        document.getElementById('f-name').value = item.name;
        document.getElementById('f-type').value = item.type;
        document.getElementById('f-isbx').value = item.isbx.toString();
        toggleZoneField();
        document.getElementById('f-commune').value = item.commune || "";
        document.getElementById('f-city').value = item.city || "";
        document.getElementById('f-addr').value = item.addr;
        document.getElementById('f-note').value = item.note;

        document.getElementById('txt-form-title').innerText = tr[lang].edit;
        document.getElementById('btn-cancel').style.display = "block";
        document.getElementById('form-anchor').scrollIntoView({behavior: "smooth"});
        applyLang();
    }

    function resetForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('f-name').value = "";
        document.getElementById('f-addr').value = "";
        document.getElementById('f-note').value = "";
        document.getElementById('txt-form-title').innerText = tr[lang].add;
        document.getElementById('btn-cancel').style.display = "none";
        applyLang();
    }

    function deleteItem(id) {
        if (confirm(tr[lang].delConfirm)) {
            data = data.filter(i => i.id !== id);
            localStorage.setItem('data_v29', JSON.stringify(data));
            render();
        }
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "carnet_adresses.json";
        a.click();
    }

    init();
</script>
</body>
</html>
