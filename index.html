<details>
<summary><strong>📄 Code complet (clique pour dérouler)</strong></summary>
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SIC ADVISOR</title>

<style>
:root { --primary:#800080; --bg:#fdfafc; }
body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;padding:20px;}
.container{max-width:760px;margin:auto;}
h1{text-align:center;color:var(--primary);}
.card{background:#fff;padding:20px;border-radius:15px;box-shadow:0 4px 12px rgba(0,0,0,.1);margin-bottom:20px;}
.result-item{border-left:8px solid var(--primary);padding:15px;border-radius:12px;margin-bottom:15px;position:relative;}
.actions{position:absolute;top:15px;right:15px;display:flex;gap:10px;}
.btn-edit,.btn-del{background:none;border:none;cursor:pointer;text-decoration:underline;font-size:.85em}
.btn-del{color:#b00020}
.badge{background:#f3e5f5;color:var(--primary);padding:3px 8px;border-radius:5px;font-size:.7em;font-weight:bold;margin-left:8px;}
.btn-maps{
display:inline-block;
margin-top:10px;
background:var(--primary);
color:#fff;
padding:10px 14px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>SIC ADVISOR</h1>
<div id="results"></div>
</div>

<script>
const TYPE_EMOJI={cafe:'☕',hotel:'🏨',restaurant:'🍽️',culture:'🎭',autre:'🏷️'};
const TYPE_KEYS=Object.keys(TYPE_EMOJI);
let lang='fr';

const tr={
fr:{edit:"📝 Modifier",maps:"🗺️ Ouvrir dans Maps",types:{
cafe:"Café",hotel:"Hôtel",restaurant:"Restaurant",culture:"Culture",autre:"Autre"
}}
};

const database=[
{
id:1,
name:"Exemple Café",
addr:"Rue de Test 1",
isBx:true,
commune:"Ixelles",
city:"",
comment:"Entrée discrète",
type:"cafe"
}
];

function buildMapsUrl(item){
const lieu=item.isBx?item.commune:item.city;
const q=`${item.name} ${item.addr}, ${lieu}, Belgique`;
const params=new URLSearchParams({api:'1',query:q,gl:'BE',hl:'fr'});
return `https://www.google.com/maps/search/?${params}`;
}

function refresh(){
const list=document.getElementById("results");
list.innerHTML="";

database.forEach(i=>{
const lieu=i.isBx?i.commune:i.city;
const type=i.type;
const url=buildMapsUrl(i);

list.innerHTML+=`
<div class="result-item">
<div class="actions">
<button class="btn-edit">${tr[lang].edit}</button>
<button class="btn-del">X</button>
</div>

<h3>
${i.name}
<span class="badge">${TYPE_EMOJI[type]} ${tr[lang].types[type]}</span>
</h3>

<p>📍 ${i.addr}, ${lieu}</p>
${i.comment?`<p style="font-style:italic;color:gray;">💬 ${i.comment}</p>`:""}

<a class="btn-maps"
href="${url}"
target="_blank"
rel="noopener noreferrer">
${tr[lang].maps}
</a>
</div>`;
});
}
  refresh();
</script>

</body>
</html>


</details>
