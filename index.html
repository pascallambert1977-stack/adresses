<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Carnet de Lieux (Version PC)</title>
    <style>
        :root { --primary: #800080; --accent: #FFD700; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 30px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
       
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        h1 { color: var(--primary); margin: 0; font-variant: small-caps; }
       
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
       
        /* Résultats */
        .result-item { background: white; padding: 20px; margin-bottom: 15px; border-radius: 10px; border-left: 10px solid var(--primary); position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .item-info h3 { margin: 0 0 5px 0; color: #000; }
        .item-info p { margin: 5px 0; color: #666; }
       
        /* Actions */
        .actions { position: absolute; top: 20px; right: 20px; }
        .btn-edit { background: #e7f0ff; color: #007bff; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-del { background: #ffe7e7; color: #dc3545; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
       
        /* Bouton Maps */
        .btn-maps { display: inline-block; background: var(--primary); color: white; text-align: center; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; }
        .btn-maps:hover { background: #600060; }

        /* Formulaire */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.9em; margin-bottom: 5px; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1em; margin-top: 10px; }
       
        .lang-toggle { background: none; border: 1px solid var(--primary); color: var(--primary); padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="txt-title">🔮 Mes Lieux de Contact</h1>
        <button class="lang-toggle" onclick="toggleLang()" id="btn-lang">🇳🇱 NL</button>
    </div>

    <div class="card">
        <div class="form-grid">
            <input type="text" id="search" placeholder="Rechercher un nom..." onkeyup="render()" class="full-width">
            <select id="filterZone" onchange="render()" class="full-width">
                <option value="all">🌍 Toutes les zones</option>
                <option value="bx">🇧🇪 Bruxelles</option>
                <option value="hors">🚗 Hors Bruxelles</option>
            </select>
        </div>
    </div>

    <div id="list"></div>

    <div class="card" id="form-area" style="border-top: 6px solid var(--accent);">
        <h2 id="form-title">➕ Ajouter un établissement</h2>
        <input type="hidden" id="edit-id">
       
        <div class="form-grid">
            <div class="full-width">
                <label>Nom de l'établissement</label>
                <input type="text" id="f-name">
            </div>
           
            <div>
                <label>Zone</label>
                <select id="f-isbx" onchange="updateZoneFields()">
                    <option value="true">Bruxelles</option>
                    <option value="false">Hors Bruxelles</option>
                </select>
            </div>

            <div id="field-bx">
                <label>Commune</label>
                <select id="f-commune"></select>
            </div>

            <div id="field-hors" style="display:none">
                <label>Ville</label>
                <input type="text" id="f-city">
            </div>

            <div class="full-width">
                <label>Adresse (Rue et numéro)</label>
                <input type="text" id="f-addr">
            </div>

            <div class="full-width">
                <label>Note / Contact</label>
                <textarea id="f-note" rows="2"></textarea>
            </div>
        </div>

        <button class="btn-save" id="btn-save" onclick="save()">Enregistrer</button>
        <button id="btn-cancel" onclick="resetForm()" style="display:none; width:100%; background:none; border:none; color:gray; cursor:pointer; margin-top:10px;">Annuler la modification</button>
    </div>
</div>

<script>
    const communes = ["Anderlecht","Auderghem","Berchem-Sainte-Agathe","Bruxelles-Ville","Etterbeek","Evere","Forest","Ganshoren","Ixelles","Jette","Koekelberg","Molenbeek-Saint-Jean","Saint-Gilles","Saint-Josse-ten-Noode","Schaerbeek","Uccle","Watermael-Boitsfort","Woluwe-Saint-Lambert","Woluwe-Saint-Pierre"];
   
    const translations = {
        fr: { title: "🔮 Mes Lieux", add: "➕ Ajouter", edit: "📝 Modifier", maps: "🗺️ Ouvrir Google Maps", save: "Enregistrer", update: "Mettre à jour" },
        nl: { title: "🔮 Mijn Plaatsen", add: "➕ Toevoegen", edit: "📝 Bewerken", maps: "🗺️ Google Maps openen", save: "Opslaan", update: "Bijwerken" }
    };

    let currentLang = localStorage.getItem('pc_lang') || 'fr';
    let data = JSON.parse(localStorage.getItem('pc_data')) || [];

    function init() {
        const sel = document.getElementById('f-commune');
        communes.forEach(c => sel.add(new Option(c, c)));
        updateLangUI();
        render();
    }

    function toggleLang() {
        currentLang = currentLang === 'fr' ? 'nl' : 'fr';
        localStorage.setItem('pc_lang', currentLang);
        updateLangUI();
        render();
    }

    function updateLangUI() {
        const t = translations[currentLang];
        document.getElementById('txt-title').innerText = t.title;
        document.getElementById('btn-lang').innerText = currentLang === 'fr' ? '🇳🇱 NL' : '🇫🇷 FR';
        const isEdit = document.getElementById('edit-id').value !== "";
        document.getElementById('btn-save').innerText = isEdit ? t.update : t.save;
    }

    function updateZoneFields() {
        const isBx = document.getElementById('f-isbx').value === "true";
        document.getElementById('field-bx').style.display = isBx ? 'block' : 'none';
        document.getElementById('field-hors').style.display = isBx ? 'none' : 'block';
    }

    function render() {
        const list = document.getElementById('list');
        const search = document.getElementById('search').value.toLowerCase();
        const zone = document.getElementById('filterZone').value;
        list.innerHTML = "";

        data.filter(item => {
            const mName = item.name.toLowerCase().includes(search);
            const mZone = (zone === 'all') || (zone === 'bx' && item.isbx) || (zone === 'hors' && !item.isbx);
            return mName && mZone;
        }).forEach(item => {
            const location = item.isbx ? item.commune : item.city;
           
            // --- CONCATÉNATION SÉCURISÉE POUR PC ---
            const queryText = encodeURIComponent(item.name + " " + item.addr + " " + location);
            const mapsUrl = "https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.google.com%2Fmaps%2Fsearch%2F%3Fapi%3D1%26query%3D&data=05%7C02%7CPascal.Lambert%40police.belgium.eu%7C430755fd22344a8df41308de6fc42e6b%7Cf7e06a0857c2479ebfa5e63a6dd83518%7C0%7C0%7C639071085547759168%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=czhOtQqnvxLtMJ1Ltn1Pk9u%2FhpcvrgijVnmQKlEqE%2Fg%3D&reserved=0" + queryText;

            list.innerHTML += `
                <div class="result-item">
                    <div class="actions">
                        <button class="btn-edit" onclick="loadItem(` + item.id + `)">Modifier</button>
                        <button class="btn-del" onclick="removeItem(` + item.id + `)">X</button>
                    </div>
                    <div class="item-info">
                        <h3>` + item.name + `</h3>
                        <p>📍 ` + item.addr + `, ` + location + `</p>
                        ` + (item.note ? `<p style="font-style:italic; font-size:0.9em;">💬 ` + item.note + `</p>` : '') + `
                    </div>
                    <a href="` + mapsUrl + `" target="_blank" class="btn-maps">` + translations[currentLang].maps + `</a>
                </div>`;
        });
    }

    function save() {
        const id = document.getElementById('edit-id').value;
        const name = document.getElementById('f-name').value;
        const addr = document.getElementById('f-addr').value;

        if(!name || !addr) return alert("Nom et Adresse obligatoires !");

        const obj = {
            id: id ? parseInt(id) : Date.now(),
            name: name,
            isbx: document.getElementById('f-isbx').value === "true",
            commune: document.getElementById('f-commune').value,
            city: document.getElementById('f-city').value,
            addr: addr,
            note: document.getElementById('f-note').value
        };

        if(id) {
            const idx = data.findIndex(x => x.id === parseInt(id));
            data[idx] = obj;
        } else {
            data.push(obj);
        }

        localStorage.setItem('pc_data', JSON.stringify(data));
        resetForm();
        render();
    }

    function loadItem(id) {
        const item = data.find(x => x.id === id);
        document.getElementById('edit-id').value = item.id;
        document.getElementById('f-name').value = item.name;
        document.getElementById('f-isbx').value = item.isbx.toString();
        updateZoneFields();
        if(item.isbx) document.getElementById('f-commune').value = item.commune;
        else document.getElementById('f-city').value = item.city;
        document.getElementById('f-addr').value = item.addr;
        document.getElementById('f-note').value = item.note || "";
       
        document.getElementById('form-title').innerText = "📝 Modifier l'établissement";
        document.getElementById('btn-cancel').style.display = 'block';
        document.getElementById('form-area').scrollIntoView({behavior: 'smooth'});
        updateLangUI();
    }

    function resetForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('f-name').value = "";
        document.getElementById('f-addr').value = "";
        document.getElementById('f-note').value = "";
        document.getElementById('form-title').innerText = "➕ Ajouter un établissement";
        document.getElementById('btn-cancel').style.display = 'none';
        updateLangUI();
    }

    function removeItem(id) {
        if(confirm("Supprimer ?")) {
            data = data.filter(x => x.id !== id);
            localStorage.setItem('pc_data', JSON.stringify(data));
            render();
        }
    }

    init();
</script>

</body>
</html>
